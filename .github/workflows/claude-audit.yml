name: Claude audit

# Weekly health check. Claude diagnoses the repo read-only, a script files each
# new finding as an agent-ready issue, and the Claude agent workflow fixes it.

on:
  schedule:
    - cron: "1 7 * * 1"
  workflow_dispatch:

concurrency:
  group: claude-audit-${{ github.repository }}

env:
  MAX_OPEN: 3
  MAX_NEW: 3

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      ran: ${{ steps.backlog.outputs.ran }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the backlog
        id: backlog
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label agent-found --state open --json number --jq length)
          if [ "$open" -ge "$MAX_OPEN" ]; then
            echo "$open audit issues still open; skipping this week." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ran=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.backlog.outputs.ran == 'true'
        with:
          fetch-depth: 0

      - name: List known issues and PRs
        if: steps.backlog.outputs.ran == 'true'
        run: |
          mkdir -p .claude-audit
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 300 --json number,title,state > .claude-audit/known-issues.json
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title > .claude-audit/open-prs.json

      - uses: anthropics/claude-code-action@v1
        if: steps.backlog.outputs.ran == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --allowedTools "Bash,Read,Write,Glob,Grep,WebFetch"
          prompt: |
            Diagnose the health of ${{ github.repository }} and write what is wrong
            as issue specs. Do not fix anything. Another agent fixes each issue
            from your spec, so the spec must be enough to work from.

            Fences: change no tracked file, and write only
            `.claude-audit/findings.json`. Never print values from `.env` files,
            tokens or credentials. You run on an Ubuntu GitHub runner; install
            what the README says you need.

            Work in this order and stop once you have the real problems:
            1. Read README, AGENTS.md or CLAUDE.md, the manifest and `.github/workflows/`.
            2. Install dependencies the documented way and run the repo's own build,
               lint, typecheck and tests. Note each command and its result.
            3. Run the tool or app the way a user would where that needs no real
               account or secret. `--help` and dry runs count.
            4. Check shipped dependencies for published advisories.
            5. Read recent CI runs with `gh run list --limit 10` and any failing logs.
            6. Check for committed secrets, personal details, or large generated or
               vendored files.

            A finding is a real problem someone would hit: a failing build or test,
            a crash, wrong behaviour, a vulnerable shipped dependency, broken CI, a
            leaked secret or personal detail, junk that breaks tooling, or missing
            docs that stop an agent working. Style and "could be nicer" are not
            findings. Zero findings is a good answer. Report at most three.

            `.claude-audit/known-issues.json` lists every issue ever filed and
            `.claude-audit/open-prs.json` the open PRs. Never report a problem one
            of them already covers, including closed issues.

            Write `.claude-audit/findings.json` as a JSON array, `[]` when clean.
            Each element:
            {"title": "states the problem, under 70 characters",
             "severity": "high | medium | low",
             "public_ok": true,
             "body": "Markdown spec"}
            Set public_ok to false when the text would expose an exploitable
            vulnerability or personal data. Those are withheld, not filed.

            The body has three sections in British English, short plain sentences
            and no em dashes. `## Problem` says what is wrong and who hits it, with
            the evidence: the command and its quoted output, or `path:line`.
            `## Change` says what to change, specific enough to do without asking.
            `## Done when` gives a check that fails today and passes after the fix.
            Never put absolute local paths, usernames, secrets, addresses or IP
            addresses in a body.

      - uses: actions/upload-artifact@v4
        if: steps.backlog.outputs.ran == 'true'
        with:
          name: findings
          path: .claude-audit/findings.json
          if-no-files-found: error

  file:
    needs: audit
    if: needs.audit.outputs.ran == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: findings

      - name: File new findings
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          const repo = process.env.GITHUB_REPOSITORY;
          const gh = (args, input) => execFileSync("gh", args, { encoding: "utf8", input }).trim();
          const say = (line) => { console.log(line); appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n"); };

          const findings = JSON.parse(readFileSync("findings.json", "utf8"));
          if (!Array.isArray(findings)) throw new Error("findings.json is not an array");
          const allowedIps = /\b(?:127\.\d+\.\d+\.\d+|192\.0\.2\.\d+|198\.51\.100\.\d+|203\.0\.113\.\d+|0\.0\.0\.0)\b/g;
          const banned = [/[A-Za-z]:[\\/]Users[\\/]/i, /\/home\/\w+/, /\/Users\/\w+/, /\b(?:\d{1,3}\.){3}\d{1,3}\b/,
            /\bsk-[A-Za-z0-9-]{10,}/, /\bgh[opsu]_[A-Za-z0-9]{20,}/, /\bgithub_pat_\w{20,}/,
            /(?<![0-9a-f])[0-9a-f]{2}([:-]?)[0-9a-f]{2}(\1[0-9a-f]{2}){4}(?![0-9a-f])/i];
          const known = new Set(JSON.parse(gh(["issue", "list", "--repo", repo, "--state", "all", "--limit", "500", "--json", "title"]))
            .map((i) => i.title.trim().toLowerCase()));
          const rank = { high: 0, medium: 1, low: 2 };

          let withheld = 0, filed = 0;
          const valid = findings.filter((f) => typeof f?.title === "string" && typeof f?.body === "string" && f.severity in rank)
            .sort((a, b) => rank[a.severity] - rank[b.severity]);
          for (const f of valid) {
            if (filed >= Number(process.env.MAX_NEW)) break;
            if (f.public_ok !== true || banned.some((re) => re.test((f.title + f.body).replace(allowedIps, "")))) { withheld++; continue; }
            if (known.has(f.title.trim().toLowerCase())) { say(`Already filed: ${f.title}`); continue; }
            const url = gh(["issue", "create", "--repo", repo, "--title", f.title, "--label", "agent-found,agent-ready",
              "--body-file", "-"], `${f.body}\n\n---\nFiled by the weekly Claude audit (severity: ${f.severity}).`);
            known.add(f.title.trim().toLowerCase());
            filed++;
            say(`Filed: ${url}`);
          }
          say(`${findings.length} findings, ${filed} filed, ${withheld} withheld.`);
          if (withheld) {
            say("Some findings were withheld because they may expose a vulnerability or personal data. Run the audit locally to see them.");
            process.exitCode = 1;
          }
          JS

      - name: Start the agent queue
        if: always()
        run: |
          next=$(gh issue list --repo "$GITHUB_REPOSITORY" --label agent-ready --state open --limit 100 \
            --json number,labels \
            --jq '[.[] | select([.labels[].name] | index("agent-working") | not) | .number] | sort | .[0] // empty')
          if [ -n "$next" ]; then gh workflow run claude.yml --repo "$GITHUB_REPOSITORY" -f issue="$next"; fi
